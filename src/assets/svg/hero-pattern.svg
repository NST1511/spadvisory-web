<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <!-- Subtle glow for gold accents -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Building fill gradient (slightly lighter than bg) -->
    <linearGradient id="buildingFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162644" />
      <stop offset="100%" stop-color="#0E1B30" />
    </linearGradient>
    <linearGradient id="buildingFill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132040" />
      <stop offset="100%" stop-color="#0C1828" />
    </linearGradient>
  </defs>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .building { animation: riseUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .b1 { animation-delay: 0.1s; }
      .b2 { animation-delay: 0.3s; }
      .b3 { animation-delay: 0.5s; }
      .b4 { animation-delay: 0.65s; }
      .b5 { animation-delay: 0.8s; }

      .gold-accent {
        opacity: 0;
        animation: goldIn 0.8s ease-out forwards;
        animation-delay: 1.1s;
      }
      .gold-glow {
        opacity: 0;
        animation: goldIn 0.8s ease-out forwards, goldPulse 4s ease-in-out 2s infinite alternate;
      }
      .gold-glow.g1 { animation-delay: 1.1s, 2s; }
      .gold-glow.g2 { animation-delay: 1.3s, 2.4s; }
      .gold-glow.g3 { animation-delay: 1.5s, 2.8s; }

      .win {
        animation: winFlicker 6s ease-in-out infinite alternate;
      }
      .win:nth-child(odd) { animation-delay: 0.8s; }
      .win:nth-child(3n) { animation-delay: 2s; animation-duration: 8s; }
      .win:nth-child(5n) { animation-delay: 3.5s; animation-duration: 5s; }

      .trend-line {
        stroke-dashoffset: 600;
        animation: drawLine 2s ease-out 1.4s forwards;
      }
      .trend-dot {
        opacity: 0;
        animation: goldIn 0.5s ease-out forwards;
      }
      .trend-dot.d1 { animation-delay: 2.2s; }
      .trend-dot.d2 { animation-delay: 2.6s; }

      .horizon-glow {
        opacity: 0;
        animation: goldIn 1.5s ease-out 0.5s forwards;
      }
    }

    @keyframes riseUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes goldIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes goldPulse {
      0%   { opacity: 0.5; }
      100% { opacity: 1; }
    }
    @keyframes winFlicker {
      0%, 30%  { fill-opacity: 0.08; }
      45%      { fill-opacity: 0.18; }
      55%      { fill-opacity: 0.05; }
      70%, 100%{ fill-opacity: 0.10; }
    }
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Faint horizon glow -->
  <ellipse class="horizon-glow" cx="300" cy="580" rx="350" ry="60" fill="#C5A55A" fill-opacity="0.04" />

  <!-- ============ BUILDING 1 — Tall center tower ============ -->
  <g class="building b1">
    <rect x="220" y="100" width="120" height="500" fill="url(#buildingFill)" stroke="#FAFAFA" stroke-width="1.5" stroke-opacity="0.35" />
    <polygon points="270,100 280,55 290,100" fill="url(#buildingFill)" stroke="#FAFAFA" stroke-width="1" stroke-opacity="0.3" />
    <line class="gold-glow g1" x1="280" y1="55" x2="280" y2="30" stroke="#C5A55A" stroke-width="1.5" filter="url(#goldGlow)" />
    <circle class="gold-glow g1" cx="280" cy="26" r="3" fill="#C5A55A" filter="url(#goldGlow)" />
    <line class="gold-accent" x1="220" y1="100" x2="340" y2="100" stroke="#C5A55A" stroke-width="2" filter="url(#goldGlow)" />
    <g stroke="none">
      <rect class="win" x="232" y="120" width="18" height="10" fill="#FAFAFA" fill-opacity="0.08" rx="1" />
      <rect class="win" x="258" y="120" width="18" height="10" fill="#FAFAFA" fill-opacity="0.06" rx="1" />
      <rect class="win" x="284" y="120" width="18" height="10" fill="#FAFAFA" fill-opacity="0.09" rx="1" />
      <rect class="win" x="310" y="120" width="18" height="10" fill="#FAFAFA" fill-opacity="0.05" rx="1" />
      <rect class="win" x="232" y="145" width="18" height="10" fill="#FAFAFA" fill-opacity="0.06" rx="1" />
      <rect class="win" x="258" y="145" width="18" height="10" fill="#FAFAFA" fill-opacity="0.10" rx="1" />
      <rect class="win" x="284" y="145" width="18" height="10" fill="#FAFAFA" fill-opacity="0.07" rx="1" />
      <rect class="win" x="310" y="145" width="18" height="10" fill="#FAFAFA" fill-opacity="0.08" rx="1" />
      <rect class="win" x="232" y="170" width="18" height="10" fill="#FAFAFA" fill-opacity="0.09" rx="1" />
      <rect class="win" x="258" y="170" width="18" height="10" fill="#FAFAFA" fill-opacity="0.05" rx="1" />
      <rect class="win" x="284" y="170" width="18" height="10" fill="#FAFAFA" fill-opacity="0.08" rx="1" />
      <rect class="win" x="310" y="170" width="18" height="10" fill="#FAFAFA" fill-opacity="0.06" rx="1" />
      <rect class="win" x="232" y="195" width="18" height="10" fill="#FAFAFA" fill-opacity="0.07" rx="1" />
      <rect class="win" x="258" y="195" width="18" height="10" fill="#FAFAFA" fill-opacity="0.08" rx="1" />
      <rect class="win" x="284" y="195" width="18" height="10" fill="#FAFAFA" fill-opacity="0.05" rx="1" />
      <rect class="win" x="310" y="195" width="18" height="10" fill="#FAFAFA" fill-opacity="0.09" rx="1" />
      <rect class="win" x="232" y="220" width="18" height="10" fill="#FAFAFA" fill-opacity="0.06" rx="1" />
      <rect class="win" x="258" y="220" width="18" height="10" fill="#FAFAFA" fill-opacity="0.07" rx="1" />
      <rect class="win" x="284" y="220" width="18" height="10" fill="#FAFAFA" fill-opacity="0.09" rx="1" />
      <rect class="win" x="310" y="220" width="18" height="10" fill="#FAFAFA" fill-opacity="0.06" rx="1" />
    </g>
  </g>

  <!-- ============ BUILDING 2 — Left mid-rise ============ -->
  <g class="building b2">
    <rect x="80" y="260" width="120" height="340" fill="url(#buildingFill2)" stroke="#FAFAFA" stroke-width="1.2" stroke-opacity="0.3" />
    <rect x="80" y="240" width="80" height="20" fill="url(#buildingFill2)" stroke="#FAFAFA" stroke-width="1" stroke-opacity="0.25" />
    <line class="gold-glow g2" x1="80" y1="240" x2="160" y2="240" stroke="#C5A55A" stroke-width="1.5" filter="url(#goldGlow)" />
    <line class="gold-accent" x1="80" y1="260" x2="200" y2="260" stroke="#C5A55A" stroke-width="1.2" stroke-opacity="0.6" />
    <g stroke="none">
      <rect class="win" x="92" y="275" width="22" height="10" fill="#FAFAFA" fill-opacity="0.07" rx="1" />
      <rect class="win" x="122" y="275" width="22" height="10" fill="#FAFAFA" fill-opacity="0.09" rx="1" />
      <rect class="win" x="160" y="275" width="22" height="10" fill="#FAFAFA" fill-opacity="0.06" rx="1" />
      <rect class="win" x="92" y="300" width="22" height="10" fill="#FAFAFA" fill-opacity="0.08" rx="1" />
      <rect class="win" x="122" y="300" width="22" height="10" fill="#FAFAFA" fill-opacity="0.06" rx="1" />
      <rect class="win" x="160" y="300" width="22" height="10" fill="#FAFAFA" fill-opacity="0.08" rx="1" />
      <rect class="win" x="92" y="325" width="22" height="10" fill="#FAFAFA" fill-opacity="0.05" rx="1" />
      <rect class="win" x="122" y="325" width="22" height="10" fill="#FAFAFA" fill-opacity="0.07" rx="1" />
      <rect class="win" x="160" y="325" width="22" height="10" fill="#FAFAFA" fill-opacity="0.06" rx="1" />
      <rect class="win" x="92" y="350" width="22" height="10" fill="#FAFAFA" fill-opacity="0.07" rx="1" />
      <rect class="win" x="122" y="350" width="22" height="10" fill="#FAFAFA" fill-opacity="0.05" rx="1" />
      <rect class="win" x="160" y="350" width="22" height="10" fill="#FAFAFA" fill-opacity="0.08" rx="1" />
    </g>
  </g>

  <!-- ============ BUILDING 3 — Right wide ============ -->
  <g class="building b3">
    <rect x="360" y="310" width="100" height="290" fill="url(#buildingFill)" stroke="#FAFAFA" stroke-width="1.2" stroke-opacity="0.28" />
    <line class="gold-glow g2" x1="360" y1="310" x2="460" y2="310" stroke="#C5A55A" stroke-width="1.5" filter="url(#goldGlow)" />
    <rect x="385" y="290" width="50" height="20" fill="url(#buildingFill2)" stroke="#FAFAFA" stroke-width="1" stroke-opacity="0.2" />
    <g stroke="none">
      <rect class="win" x="372" y="328" width="18" height="10" fill="#FAFAFA" fill-opacity="0.07" rx="1" />
      <rect class="win" x="398" y="328" width="18" height="10" fill="#FAFAFA" fill-opacity="0.09" rx="1" />
      <rect class="win" x="430" y="328" width="18" height="10" fill="#FAFAFA" fill-opacity="0.06" rx="1" />
      <rect class="win" x="372" y="353" width="18" height="10" fill="#FAFAFA" fill-opacity="0.06" rx="1" />
      <rect class="win" x="398" y="353" width="18" height="10" fill="#FAFAFA" fill-opacity="0.07" rx="1" />
      <rect class="win" x="430" y="353" width="18" height="10" fill="#FAFAFA" fill-opacity="0.08" rx="1" />
      <rect class="win" x="372" y="378" width="18" height="10" fill="#FAFAFA" fill-opacity="0.08" rx="1" />
      <rect class="win" x="398" y="378" width="18" height="10" fill="#FAFAFA" fill-opacity="0.05" rx="1" />
      <rect class="win" x="430" y="378" width="18" height="10" fill="#FAFAFA" fill-opacity="0.07" rx="1" />
    </g>
  </g>

  <!-- ============ BUILDING 4 — Far right narrow tower ============ -->
  <g class="building b4">
    <rect x="480" y="190" width="55" height="410" fill="url(#buildingFill2)" stroke="#FAFAFA" stroke-width="1" stroke-opacity="0.22" />
    <line class="gold-glow g3" x1="507" y1="190" x2="507" y2="155" stroke="#C5A55A" stroke-width="1.2" filter="url(#goldGlow)" />
    <circle class="gold-glow g3" cx="507" cy="152" r="2.5" fill="#C5A55A" filter="url(#goldGlow)" />
    <line class="gold-accent" x1="480" y1="190" x2="535" y2="190" stroke="#C5A55A" stroke-width="1.2" stroke-opacity="0.7" />
    <g stroke="none">
      <rect class="win" x="490" y="208" width="14" height="8" fill="#FAFAFA" fill-opacity="0.08" rx="1" />
      <rect class="win" x="512" y="208" width="14" height="8" fill="#FAFAFA" fill-opacity="0.06" rx="1" />
      <rect class="win" x="490" y="230" width="14" height="8" fill="#FAFAFA" fill-opacity="0.06" rx="1" />
      <rect class="win" x="512" y="230" width="14" height="8" fill="#FAFAFA" fill-opacity="0.09" rx="1" />
      <rect class="win" x="490" y="252" width="14" height="8" fill="#FAFAFA" fill-opacity="0.07" rx="1" />
      <rect class="win" x="512" y="252" width="14" height="8" fill="#FAFAFA" fill-opacity="0.05" rx="1" />
    </g>
  </g>

  <!-- ============ BUILDING 5 — Far left small ============ -->
  <g class="building b5">
    <rect x="25" y="380" width="40" height="220" fill="url(#buildingFill)" stroke="#FAFAFA" stroke-width="0.8" stroke-opacity="0.15" />
    <line class="gold-accent" x1="25" y1="380" x2="65" y2="380" stroke="#C5A55A" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- ============ Ground / horizon ============ -->
  <line class="gold-accent" x1="0" y1="598" x2="600" y2="598" stroke="#C5A55A" stroke-width="1.5" stroke-opacity="0.5" filter="url(#goldGlow)" />

  <!-- Growth trend line (animated draw) -->
  <line class="trend-line" x1="40" y1="520" x2="280" y2="100" stroke="#C5A55A" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="600" />
  <line class="trend-line" x1="280" y1="100" x2="530" y2="170" stroke="#C5A55A" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="600" />
  <!-- Trend node dots -->
  <circle class="trend-dot d1" cx="280" cy="100" r="3" fill="#C5A55A" fill-opacity="0.4" />
  <circle class="trend-dot d2" cx="530" cy="170" r="2.5" fill="#C5A55A" fill-opacity="0.3" />
</svg>
